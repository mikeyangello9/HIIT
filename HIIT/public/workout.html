<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="workout.css">

<body>

    <div class="countdown">
        <p class="countdown-display">3</p>
    </div>

    <div class="info">
        <div class="next-workout">NEXT</div>
        <div class="current-workout-desc">inform</div>
    </div>

    <div class="workout-instances">
        <div class="workout-instance">
            <div class="gif">
                <img class="gif-start" src="" alt="">
            </div>
            <div class="name elem glass">
                <p class="workout-name">workout name</p>
            </div>

            <div class="time elem glass">
                <p class="duration">00</p>
            </div>

            <div class="rest elem glass">
                <p class="rest-time">00</p>
            </div>

            <div class="control">
                <div class="pause elem">
                    <button class="pause-button">PAUSE</button>
                </div>
                <div class="RESUME elem">
                    <button disabled class="resume-button">RESUME</button>
                </div>
            </div>
           

        </div>

        
    </div>
        <div class="workout-end">

                <ul class="heading">
                    <li>Workouts completed</li>
                    <li>Total Time</li>
                </ul>

                <ul class="workout-info">
                        <li class="workout-count">number</li>
                        <li class="used-time"></li>
                </ul>  
        </div>

</body>

<script src="./workout.js"></script>
</html>
